project:
  type: website
  output-dir: _site

website:
  title: "NetFleet Docs"
  description: "Infrastructure Engineering Knowledge Hub"

  navbar:
    title: "NETFLEET"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Networking"
        href: learning/networking/index.qmd

  page-navigation: true

format:
  html:
    theme:
      - darkly
      - styles/custom.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true

language:
  title-block-author: "Author"