  page-navigation: true

format:
  html:
    theme:
      - darkly
      - styles/custom.scss
    css:
      - assets/css/fonts.css
      - assets/css/quiz.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true

    include-after-body:
      text: |
        <script>
        (() => {
          // Load the quiz engine only on pages that contain a quiz.
          if (!document.querySelector("[data-nf-quiz]")) return;

          // Quarto publishes the relative path back to the site root on every page,
          // so this works on GitHub Pages sub-paths, custom domains and local preview.
          const meta = document.querySelector('meta[name="quarto:offset"]');
          const offset = meta ? meta.getAttribute("content") : "./";
          const script = document.createElement("script");
          script.src = new URL(offset + "assets/js/labs/network-fundamentals.js", window.location.href).href;
          script.async = false;
          document.head.appendChild(script);
        })();
        </script>

language:
  title-block-author: "Author"
